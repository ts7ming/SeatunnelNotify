# ============================================================
# SeaTunnel 事件通知 配置文件
# 位置: $SEATUNNEL_HOME/ext/config.yaml
# 每次事件触发时都会实时读取本文件(内容变化即重新解析)
# ============================================================

# 总开关
enabled: true

# 消息模板占位符 (title/content 中可用, 区分大小写):
#   {event_type}  事件类型, 如 JOB_STATUS / SCHEMA_CHANGE / READER_OPEN
#   {time}        事件时间
#   {job_id}      任务ID
#   {job_name}    任务名称
#   {job_status}  任务状态, 如 FAILED / FINISHED / CANCELED
#   {table}       表名
#   {raw}         原始事件 toString
# 每个事件分类都可选配 title/content 模板; 不填则使用内置默认文案。

# 事件订阅 (动态订阅, 按需开启)
events:
  # 任务状态事件 (成功/失败/取消等)
  job_status:
    enabled: true
    # 仅在这些状态下通知, 留空表示全部状态
    # 可选值: CREATED, RUNNING, FINISHED, FAILED, CANCELED, FAILING, CANCELLING ...
    statuses: [FAILED, FINISHED, CANCELED]
    # 自定义标题/内容模板 (可选, 取消注释并修改即生效):
    # title: "【任务{job_status}】"
    # content: |
    #   事件类型: {event_type}
    #   任务ID: {job_id}
    #   任务名称: {job_name}
    #   状态: {job_status}
    #   时间: {time}
  # 表结构变更事件 (加列/删列/改列/改表等)
  schema_change:
    enabled: true
    # title: "【表结构变更】"
    # content: |
    #   事件类型: {event_type}
    #   表: {table}
    #   时间: {time}
  # 读写生命周期事件 (READER_OPEN/CLOSE, WRITER_OPEN/CLOSE ...)
  lifecycle:
    enabled: false
    # title: "【读写生命周期】"
    # content: |
    #   事件类型: {event_type}
    #   表: {table}
    #   时间: {time}
  # 其他未归类事件
  others:
    enabled: false
    # title: "【其他事件】"
    # content: |
    #   事件类型: {event_type}
    #   时间: {time}
    #   详情: {raw}

# 通知渠道 (可同时开启多个, 动态选择接收方式)
channels:
  # 钉钉机器人
  dingtalk:
    enabled: false
    webhook: https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN
    secret: YOUR_SECRET   # 加签密钥, 留空表示不使用加签
  # 企业微信机器人
  wechat:
    enabled: false
    webhook: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY
  # 飞书机器人
  feishu:
    enabled: false
    webhook: https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_HOOK
    secret: YOUR_SECRET   # 加签密钥(安全设置-签名校验), 留空表示不使用
  # 邮件
  email:
    enabled: false
    host: smtp.example.com
    port: 465
    username: user@example.com
    password: your_password
    from: user@example.com
    to: [admin@example.com, ops@example.com]
    subject: SeaTunnel 事件通知
    ssl: true
